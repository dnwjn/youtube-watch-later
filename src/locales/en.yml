changelog:
  v1_0_0:
    new_1: "Added support for 12 languages. By default, the extension follows your browser language."
    new_2: "Added a Language setting to the popup, so you can choose the extension's language yourself."
  v0_6_3:
    fixed_1: "Reduced unnecessary re-renders of the button by avoiding state updates that ran synchronously during render."
  v0_6_2:
    fixed_1: "Fixed an issue where the extension could slow down the page the longer you kept browsing, by removing a redundant refresh loop for the button."
  v0_6_1:
    new_1: "Added an 'Open What's New on update' setting, so you can control whether this tab opens automatically after an update."
  v0_6_0:
    new_1: "Added more position options for the button, including bottom-left and bottom-right."
    new_2: "Added a link to this What's New tab in the popup footer, so you can now always see the latest changes instead of just once per update."
    improved_1: "The button now only shows once your settings have finished loading, preventing it from flashing in the wrong position."
    improved_2: "Position settings moved to their own subpage and now apply immediately, without needing to reload the page."
    improved_3: "Decreased font sizes and limited the height of the popup for a more compact look."
    fixed_1: "Fixed an issue where the button could stop working if the primary cookie was missing, by falling back to its 1st-party and 3rd-party variants."
    fixed_2: "Fixed the button disappearing or flashing when hovering over thumbnail previews."
  v0_5_3:
    fixed_1: "Fixed an issue where the button would not show up in the suggested videos on the right side of the video player."
  v0_5_2:
    fixed_1: "Fixed an issue on Firefox, where the button would not work in combination with the Multi-Account Containers extension."
  v0_5_1:
    new_1: "Added this What's New tab (hi!), so you can stay informed about the noteworthy recent changes."
  v0_5_0:
    new_1: "Added the button to the suggested videos on the player page, next to (desktop) and below (mobile) the player."
    improved_1: "The button is now round to better match YouTube's design."
  v0_4_2:
    fixed_1: "Fixed an issue where the button would not always be visible."
    fixed_2: "Fixed an issue where the colors would not match custom themes."
  v0_4_0:
    new_1: "Added the button to the suggested videos in the modern video endscreen."
    new_2: "Added the button to shorts."
  v0_3_0:
    new_1: "Added the button to the video player controls, next to the like/dislike buttons."
  v0_2_0:
    new_1: "Added the button to the suggested videos in the classic video endscreen."
