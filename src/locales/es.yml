changelog:
  v0_6_3:
    fixed_1: "Se redujeron los renderizados innecesarios del botón evitando actualizaciones de estado que se ejecutaban de forma síncrona durante el renderizado."
  v0_6_2:
    fixed_1: "Se corrigió un problema por el que la extensión podía ralentizar la página cuanto más tiempo navegabas, eliminando un bucle de actualización redundante del botón."
  v0_6_1:
    new_1: "Se añadió el ajuste «Abrir Novedades al actualizar» para que puedas decidir si esta pestaña se abre automáticamente tras una actualización."
  v0_6_0:
    new_1: "Se añadieron más opciones de posición para el botón, incluidas abajo a la izquierda y abajo a la derecha."
    new_2: "Se añadió un enlace a esta pestaña de Novedades en el pie del popup, para que siempre puedas ver los últimos cambios y no solo una vez por actualización."
    improved_1: "El botón ahora solo aparece cuando tus ajustes terminan de cargarse, lo que evita que parpadee en la posición equivocada."
    improved_2: "Los ajustes de posición se movieron a su propia subpágina y ahora se aplican al instante, sin recargar la página."
    improved_3: "Se redujeron los tamaños de fuente y se limitó la altura del popup para un aspecto más compacto."
    fixed_1: "Se corrigió un problema por el que el botón podía dejar de funcionar si faltaba la cookie principal, recurriendo a sus variantes propias y de terceros."
    fixed_2: "Se corrigió que el botón desapareciera o parpadeara al pasar el cursor sobre las vistas previas de las miniaturas."
  v0_5_3:
    fixed_1: "Se corrigió un problema por el que el botón no aparecía en los vídeos sugeridos a la derecha del reproductor."
  v0_5_2:
    fixed_1: "Se corrigió un problema en Firefox por el que el botón no funcionaba junto con la extensión Multi-Account Containers."
  v0_5_1:
    new_1: "Se añadió esta pestaña de Novedades (¡hola!) para que estés al tanto de los cambios recientes más importantes."
  v0_5_0:
    new_1: "Se añadió el botón a los vídeos sugeridos de la página del reproductor, junto al reproductor (escritorio) y debajo de él (móvil)."
    improved_1: "El botón ahora es redondo para ajustarse mejor al diseño de YouTube."
  v0_4_2:
    fixed_1: "Se corrigió un problema por el que el botón no siempre era visible."
    fixed_2: "Se corrigió un problema por el que los colores no coincidían con los temas personalizados."
  v0_4_0:
    new_1: "Se añadió el botón a los vídeos sugeridos de la pantalla final moderna."
    new_2: "Se añadió el botón a los Shorts."
  v0_3_0:
    new_1: "Se añadió el botón a los controles del reproductor, junto a los botones de me gusta y no me gusta."
  v0_2_0:
    new_1: "Se añadió el botón a los vídeos sugeridos de la pantalla final clásica."
