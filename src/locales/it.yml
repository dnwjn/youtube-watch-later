changelog:
  v1_0_0:
    new_1: "Aggiunto il supporto per 12 lingue. Per impostazione predefinita, l'estensione segue la lingua del browser."
    new_2: "Aggiunta un'impostazione della lingua nel popup, per scegliere tu stesso la lingua dell'estensione."
  v0_6_3:
    fixed_1: "Ridotti i rendering inutili del pulsante evitando aggiornamenti di stato eseguiti in modo sincrono durante il rendering."
  v0_6_2:
    fixed_1: "Corretto un problema per cui l'estensione poteva rallentare la pagina quanto più a lungo navigavi, rimuovendo un ciclo di aggiornamento ridondante del pulsante."
  v0_6_1:
    new_1: "Aggiunta l'impostazione «Apri Novità dopo l'aggiornamento», per decidere se questa scheda si apre automaticamente dopo un aggiornamento."
  v0_6_0:
    new_1: "Aggiunte più opzioni di posizione per il pulsante, tra cui in basso a sinistra e in basso a destra."
    new_2: "Aggiunto un link a questa scheda Novità nel piè di pagina del popup, così puoi vedere sempre le ultime modifiche e non solo una volta per aggiornamento."
    improved_1: "Il pulsante ora compare solo dopo che le impostazioni sono state caricate, evitando che lampeggi nella posizione sbagliata."
    improved_2: "Le impostazioni di posizione sono state spostate in una sottopagina dedicata e ora si applicano subito, senza ricaricare la pagina."
    improved_3: "Ridotte le dimensioni dei caratteri e limitata l'altezza del popup per un aspetto più compatto."
    fixed_1: "Corretto un problema per cui il pulsante poteva smettere di funzionare se mancava il cookie principale, ripiegando sulle varianti first-party e third-party."
    fixed_2: "Corretto il pulsante che scompariva o lampeggiava passando il mouse sulle anteprime delle miniature."
  v0_5_3:
    fixed_1: "Corretto un problema per cui il pulsante non compariva nei video suggeriti a destra del lettore video."
  v0_5_2:
    fixed_1: "Corretto un problema su Firefox per cui il pulsante non funzionava insieme all'estensione Multi-Account Containers."
  v0_5_1:
    new_1: "Aggiunta questa scheda Novità (ciao!), per restare informato sulle ultime modifiche rilevanti."
  v0_5_0:
    new_1: "Aggiunto il pulsante ai video suggeriti nella pagina del lettore, accanto (desktop) e sotto (mobile) al lettore."
    improved_1: "Il pulsante ora è rotondo, per adattarsi meglio al design di YouTube."
  v0_4_2:
    fixed_1: "Corretto un problema per cui il pulsante non era sempre visibile."
    fixed_2: "Corretto un problema per cui i colori non corrispondevano ai temi personalizzati."
  v0_4_0:
    new_1: "Aggiunto il pulsante ai video suggeriti nella schermata finale moderna."
    new_2: "Aggiunto il pulsante agli Shorts."
  v0_3_0:
    new_1: "Aggiunto il pulsante ai controlli del lettore video, accanto ai pulsanti Mi piace e Non mi piace."
  v0_2_0:
    new_1: "Aggiunto il pulsante ai video suggeriti nella schermata finale classica."
