changelog:
  v1_0_0:
    new_1: "Ondersteuning voor 12 talen toegevoegd. Standaard volgt de extensie de taal van je browser."
    new_2: "Een taalinstelling toegevoegd aan de popup, zodat je zelf de taal van de extensie kunt kiezen."
  v0_6_3:
    fixed_1: "Onnodige herrenders van de knop verminderd door statusupdates te vermijden die synchroon tijdens het renderen liepen."
  v0_6_2:
    fixed_1: "Een probleem opgelost waarbij de extensie de pagina trager kon maken naarmate je langer bleef browsen, door een overbodige verversingslus voor de knop te verwijderen."
  v0_6_1:
    new_1: "Een instelling 'Wat is er nieuw openen bij update' toegevoegd, zodat je kunt bepalen of dit tabblad na een update automatisch opent."
  v0_6_0:
    new_1: "Meer positieopties voor de knop toegevoegd, waaronder linksonder en rechtsonder."
    new_2: "Een link naar dit tabblad 'Wat is er nieuw' toegevoegd in de voettekst van de popup, zodat je de laatste wijzigingen altijd kunt zien in plaats van slechts één keer per update."
    improved_1: "De knop verschijnt nu pas zodra je instellingen zijn geladen, waardoor hij niet meer op de verkeerde plek flitst."
    improved_2: "Positie-instellingen verplaatst naar een eigen subpagina; ze worden nu direct toegepast, zonder de pagina te hoeven herladen."
    improved_3: "Lettergroottes verkleind en de hoogte van de popup beperkt voor een compactere uitstraling."
    fixed_1: "Een probleem opgelost waarbij de knop kon stoppen met werken als de primaire cookie ontbrak, door terug te vallen op de first-party- en third-partyvarianten."
    fixed_2: "Opgelost dat de knop verdween of flitste bij het aanwijzen van miniatuurvoorbeelden."
  v0_5_3:
    fixed_1: "Een probleem opgelost waarbij de knop niet verscheen in de voorgestelde video's rechts van de videospeler."
  v0_5_2:
    fixed_1: "Een probleem in Firefox opgelost waarbij de knop niet werkte in combinatie met de extensie Multi-Account Containers."
  v0_5_1:
    new_1: "Dit tabblad 'Wat is er nieuw' toegevoegd (hoi!), zodat je op de hoogte blijft van de belangrijkste recente wijzigingen."
  v0_5_0:
    new_1: "De knop toegevoegd aan de voorgestelde video's op de spelerpagina, naast (desktop) en onder (mobiel) de speler."
    improved_1: "De knop is nu rond, zodat hij beter bij het ontwerp van YouTube past."
  v0_4_2:
    fixed_1: "Een probleem opgelost waarbij de knop niet altijd zichtbaar was."
    fixed_2: "Een probleem opgelost waarbij de kleuren niet bij aangepaste thema's pasten."
  v0_4_0:
    new_1: "De knop toegevoegd aan de voorgestelde video's in het moderne eindscherm."
    new_2: "De knop toegevoegd aan Shorts."
  v0_3_0:
    new_1: "De knop toegevoegd aan de bediening van de videospeler, naast de like- en dislikeknoppen."
  v0_2_0:
    new_1: "De knop toegevoegd aan de voorgestelde video's in het klassieke eindscherm."
