changelog:
  v0_6_3:
    fixed_1: "Зменшено кількість зайвих перемальовувань кнопки: оновлення стану більше не виконуються синхронно під час відтворення."
  v0_6_2:
    fixed_1: "Виправлено проблему, через яку розширення могло сповільнювати сторінку під час тривалого перегляду: прибрано зайвий цикл оновлення кнопки."
  v0_6_1:
    new_1: "Додано налаштування «Відкривати „Що нового“ після оновлення», щоб ви могли вирішувати, чи відкривати цю вкладку автоматично після оновлення."
  v0_6_0:
    new_1: "Додано нові варіанти розташування кнопки, зокрема внизу ліворуч і внизу праворуч."
    new_2: "Додано посилання на цю вкладку «Що нового» у футері спливаючого вікна, тож останні зміни завжди під рукою, а не лише раз після оновлення."
    improved_1: "Кнопка тепер з'являється лише після завантаження налаштувань, тому не мерехтить у неправильному місці."
    improved_2: "Налаштування розташування перенесено на окрему сторінку, і вони застосовуються одразу, без перезавантаження сторінки."
    improved_3: "Зменшено розміри шрифтів і обмежено висоту спливаючого вікна для компактнішого вигляду."
    fixed_1: "Виправлено проблему, через яку кнопка могла перестати працювати за відсутності основного файлу cookie: тепер використовуються його варіанти first-party і third-party."
    fixed_2: "Виправлено зникання та мерехтіння кнопки під час наведення на попередній перегляд мініатюр."
  v0_5_3:
    fixed_1: "Виправлено проблему, через яку кнопка не з'являлася в рекомендованих відео праворуч від відеоплеєра."
  v0_5_2:
    fixed_1: "Виправлено проблему у Firefox: кнопка не працювала разом із розширенням Multi-Account Containers."
  v0_5_1:
    new_1: "Додано цю вкладку «Що нового» (привіт!), щоб ви були в курсі важливих останніх змін."
  v0_5_0:
    new_1: "Кнопку додано до рекомендованих відео на сторінці плеєра: поруч із плеєром (комп'ютер) і під ним (мобільні пристрої)."
    improved_1: "Кнопка тепер кругла, щоб краще відповідати дизайну YouTube."
  v0_4_2:
    fixed_1: "Виправлено проблему, через яку кнопка не завжди була видимою."
    fixed_2: "Виправлено проблему, через яку кольори не відповідали користувацьким темам."
  v0_4_0:
    new_1: "Кнопку додано до рекомендованих відео в сучасній кінцевій заставці."
    new_2: "Кнопку додано до Shorts."
  v0_3_0:
    new_1: "Кнопку додано до елементів керування відеоплеєра, поруч із кнопками «подобається» і «не подобається»."
  v0_2_0:
    new_1: "Кнопку додано до рекомендованих відео в класичній кінцевій заставці."
