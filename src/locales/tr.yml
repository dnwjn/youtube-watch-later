changelog:
  v0_6_3:
    fixed_1: "Oluşturma sırasında eşzamanlı çalışan durum güncellemeleri önlenerek düğmenin gereksiz yeniden oluşturulmaları azaltıldı."
  v0_6_2:
    fixed_1: "Düğme için gereksiz bir yenileme döngüsü kaldırılarak, uzantının gezindikçe sayfayı yavaşlatabilmesi sorunu düzeltildi."
  v0_6_1:
    new_1: "Güncellemeden sonra bu sekmenin otomatik açılıp açılmayacağını kontrol edebilmeniz için “Güncellemede Yenilikler'i aç” ayarı eklendi."
  v0_6_0:
    new_1: "Düğme için sol alt ve sağ alt dahil daha fazla konum seçeneği eklendi."
    new_2: "Açılır pencerenin altbilgisine bu Yenilikler sekmesine bir bağlantı eklendi; böylece son değişiklikleri yalnızca güncelleme başına bir kez değil, her zaman görebilirsiniz."
    improved_1: "Düğme artık yalnızca ayarlarınız yüklendikten sonra gösteriliyor; yanlış konumda yanıp sönmesi önlendi."
    improved_2: "Konum ayarları kendi alt sayfasına taşındı ve artık sayfayı yeniden yüklemeye gerek kalmadan hemen uygulanıyor."
    improved_3: "Daha derli toplu bir görünüm için yazı tipi boyutları küçültüldü ve açılır pencerenin yüksekliği sınırlandırıldı."
    fixed_1: "Birincil çerez eksik olduğunda düğmenin çalışmayı durdurabilmesi sorunu, birinci taraf ve üçüncü taraf varyantlarına geri dönülerek düzeltildi."
    fixed_2: "Küçük resim önizlemelerinin üzerine gelindiğinde düğmenin kaybolması veya yanıp sönmesi düzeltildi."
  v0_5_3:
    fixed_1: "Düğmenin video oynatıcının sağındaki önerilen videolarda görünmemesi sorunu düzeltildi."
  v0_5_2:
    fixed_1: "Firefox'ta düğmenin Multi-Account Containers uzantısıyla birlikte çalışmaması sorunu düzeltildi."
  v0_5_1:
    new_1: "Önemli son değişikliklerden haberdar olabilmeniz için bu Yenilikler sekmesi eklendi (merhaba!)."
  v0_5_0:
    new_1: "Düğme, oynatıcı sayfasındaki önerilen videolara eklendi: oynatıcının yanında (masaüstü) ve altında (mobil)."
    improved_1: "Düğme artık YouTube'un tasarımına daha iyi uyması için yuvarlak."
  v0_4_2:
    fixed_1: "Düğmenin her zaman görünür olmaması sorunu düzeltildi."
    fixed_2: "Renklerin özel temalarla uyuşmaması sorunu düzeltildi."
  v0_4_0:
    new_1: "Düğme, modern bitiş ekranındaki önerilen videolara eklendi."
    new_2: "Düğme Shorts'a eklendi."
  v0_3_0:
    new_1: "Düğme, video oynatıcı denetimlerine, beğen ve beğenme düğmelerinin yanına eklendi."
  v0_2_0:
    new_1: "Düğme, klasik bitiş ekranındaki önerilen videolara eklendi."
