changelog:
  v0_6_3:
    fixed_1: "Ograniczono zbędne ponowne renderowanie przycisku, unikając aktualizacji stanu wykonywanych synchronicznie podczas renderowania."
  v0_6_2:
    fixed_1: "Naprawiono problem, w którym rozszerzenie mogło spowalniać stronę tym bardziej, im dłużej przeglądałeś, przez usunięcie zbędnej pętli odświeżania przycisku."
  v0_6_1:
    new_1: "Dodano ustawienie „Otwieraj Co nowego po aktualizacji”, aby można było zdecydować, czy ta karta ma otwierać się automatycznie po aktualizacji."
  v0_6_0:
    new_1: "Dodano więcej opcji położenia przycisku, w tym lewy dolny i prawy dolny róg."
    new_2: "Dodano link do karty Co nowego w stopce wyskakującego okna, dzięki czemu zawsze możesz zobaczyć najnowsze zmiany, a nie tylko raz po aktualizacji."
    improved_1: "Przycisk pojawia się teraz dopiero po załadowaniu ustawień, dzięki czemu nie migocze w niewłaściwym miejscu."
    improved_2: "Ustawienia położenia przeniesiono na osobną podstronę i są teraz stosowane natychmiast, bez konieczności przeładowania strony."
    improved_3: "Zmniejszono rozmiary czcionek i ograniczono wysokość wyskakującego okna dla bardziej zwartego wyglądu."
    fixed_1: "Naprawiono problem, w którym przycisk mógł przestać działać, gdy brakowało głównego pliku cookie, przez użycie jego wariantów first-party i third-party."
    fixed_2: "Naprawiono znikanie lub migotanie przycisku po najechaniu na podglądy miniatur."
  v0_5_3:
    fixed_1: "Naprawiono problem, w którym przycisk nie pojawiał się w sugerowanych filmach po prawej stronie odtwarzacza."
  v0_5_2:
    fixed_1: "Naprawiono problem w Firefoksie, w którym przycisk nie działał razem z rozszerzeniem Multi-Account Containers."
  v0_5_1:
    new_1: "Dodano tę kartę Co nowego (cześć!), abyś mógł być na bieżąco z najważniejszymi ostatnimi zmianami."
  v0_5_0:
    new_1: "Dodano przycisk do sugerowanych filmów na stronie odtwarzacza, obok (komputer) i pod (telefon) odtwarzaczem."
    improved_1: "Przycisk jest teraz okrągły, aby lepiej pasować do wyglądu YouTube."
  v0_4_2:
    fixed_1: "Naprawiono problem, w którym przycisk nie zawsze był widoczny."
    fixed_2: "Naprawiono problem, w którym kolory nie pasowały do niestandardowych motywów."
  v0_4_0:
    new_1: "Dodano przycisk do sugerowanych filmów na nowoczesnym ekranie końcowym."
    new_2: "Dodano przycisk do Shorts."
  v0_3_0:
    new_1: "Dodano przycisk do elementów sterujących odtwarzacza, obok przycisków „Lubię to” i „Nie lubię”."
  v0_2_0:
    new_1: "Dodano przycisk do sugerowanych filmów na klasycznym ekranie końcowym."
