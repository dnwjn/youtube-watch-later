changelog:
  v0_6_3:
    fixed_1: "Unnötige Neuberechnungen der Schaltfläche reduziert, indem Statusaktualisierungen vermieden werden, die synchron während des Renderns liefen."
  v0_6_2:
    fixed_1: "Ein Problem behoben, bei dem die Erweiterung die Seite umso langsamer machen konnte, je länger du gesurft hast, indem eine überflüssige Aktualisierungsschleife für die Schaltfläche entfernt wurde."
  v0_6_1:
    new_1: "Eine Einstellung „‚Neuigkeiten‘ nach Update öffnen“ hinzugefügt, mit der du steuern kannst, ob dieser Tab nach einem Update automatisch geöffnet wird."
  v0_6_0:
    new_1: "Weitere Positionsoptionen für die Schaltfläche hinzugefügt, darunter unten links und unten rechts."
    new_2: "Einen Link zu diesem Tab „Neuigkeiten“ in der Fußzeile des Popups hinzugefügt, sodass du die neuesten Änderungen jetzt jederzeit sehen kannst und nicht nur einmal pro Update."
    improved_1: "Die Schaltfläche wird jetzt erst angezeigt, wenn deine Einstellungen geladen sind, sodass sie nicht mehr an der falschen Stelle aufblitzt."
    improved_2: "Positionseinstellungen auf eine eigene Unterseite verschoben; sie werden jetzt sofort angewendet, ohne die Seite neu laden zu müssen."
    improved_3: "Schriftgrößen verkleinert und die Höhe des Popups begrenzt für ein kompakteres Aussehen."
    fixed_1: "Ein Problem behoben, bei dem die Schaltfläche nicht mehr funktionieren konnte, wenn das primäre Cookie fehlte, indem auf die First-Party- und Third-Party-Varianten zurückgegriffen wird."
    fixed_2: "Behoben, dass die Schaltfläche beim Darüberfahren über Thumbnail-Vorschauen verschwand oder flackerte."
  v0_5_3:
    fixed_1: "Ein Problem behoben, bei dem die Schaltfläche in den vorgeschlagenen Videos rechts neben dem Videoplayer nicht angezeigt wurde."
  v0_5_2:
    fixed_1: "Ein Problem in Firefox behoben, bei dem die Schaltfläche in Kombination mit der Erweiterung Multi-Account Containers nicht funktionierte."
  v0_5_1:
    new_1: "Diesen Tab „Neuigkeiten“ hinzugefügt (hallo!), damit du über die wichtigsten aktuellen Änderungen informiert bleibst."
  v0_5_0:
    new_1: "Die Schaltfläche zu den vorgeschlagenen Videos auf der Playerseite hinzugefügt, neben (Desktop) und unter (Mobil) dem Player."
    improved_1: "Die Schaltfläche ist jetzt rund, um besser zum Design von YouTube zu passen."
  v0_4_2:
    fixed_1: "Ein Problem behoben, bei dem die Schaltfläche nicht immer sichtbar war."
    fixed_2: "Ein Problem behoben, bei dem die Farben nicht zu benutzerdefinierten Designs passten."
  v0_4_0:
    new_1: "Die Schaltfläche zu den vorgeschlagenen Videos im modernen Endbildschirm hinzugefügt."
    new_2: "Die Schaltfläche zu Shorts hinzugefügt."
  v0_3_0:
    new_1: "Die Schaltfläche zu den Steuerelementen des Videoplayers hinzugefügt, neben den Gefällt-mir- und Gefällt-mir-nicht-Schaltflächen."
  v0_2_0:
    new_1: "Die Schaltfläche zu den vorgeschlagenen Videos im klassischen Endbildschirm hinzugefügt."
