changelog:
  v1_0_0:
    new_1: "Adicionado suporte a 12 idiomas. Por padrão, a extensão segue o idioma do seu navegador."
    new_2: "Adicionada a configuração de idioma no popup, para você escolher o idioma da extensão."
  v0_6_3:
    fixed_1: "Redução de renderizações desnecessárias do botão, evitando atualizações de estado que rodavam de forma síncrona durante a renderização."
  v0_6_2:
    fixed_1: "Corrigido um problema em que a extensão podia deixar a página mais lenta quanto mais tempo você navegava, removendo um loop de atualização redundante do botão."
  v0_6_1:
    new_1: "Adicionada a configuração “Abrir Novidades ao atualizar”, para você controlar se esta guia abre automaticamente após uma atualização."
  v0_6_0:
    new_1: "Adicionadas mais opções de posição para o botão, incluindo inferior esquerdo e inferior direito."
    new_2: "Adicionado um link para esta guia de Novidades no rodapé do popup, para que você possa ver sempre as últimas alterações, e não apenas uma vez por atualização."
    improved_1: "O botão agora só aparece depois que suas configurações terminam de carregar, evitando que pisque na posição errada."
    improved_2: "As configurações de posição foram movidas para uma subpágina própria e agora são aplicadas imediatamente, sem precisar recarregar a página."
    improved_3: "Tamanhos de fonte reduzidos e altura do popup limitada para um visual mais compacto."
    fixed_1: "Corrigido um problema em que o botão podia parar de funcionar se o cookie principal estivesse ausente, recorrendo às variantes first-party e third-party."
    fixed_2: "Corrigido o botão que desaparecia ou piscava ao passar o mouse sobre as prévias das miniaturas."
  v0_5_3:
    fixed_1: "Corrigido um problema em que o botão não aparecia nos vídeos sugeridos à direita do player de vídeo."
  v0_5_2:
    fixed_1: "Corrigido um problema no Firefox em que o botão não funcionava junto com a extensão Multi-Account Containers."
  v0_5_1:
    new_1: "Adicionada esta guia de Novidades (oi!), para você se manter informado sobre as alterações recentes mais relevantes."
  v0_5_0:
    new_1: "Adicionado o botão aos vídeos sugeridos na página do player, ao lado (computador) e abaixo (celular) do player."
    improved_1: "O botão agora é redondo, para combinar melhor com o design do YouTube."
  v0_4_2:
    fixed_1: "Corrigido um problema em que o botão nem sempre estava visível."
    fixed_2: "Corrigido um problema em que as cores não combinavam com temas personalizados."
  v0_4_0:
    new_1: "Adicionado o botão aos vídeos sugeridos na tela final moderna."
    new_2: "Adicionado o botão aos Shorts."
  v0_3_0:
    new_1: "Adicionado o botão aos controles do player de vídeo, ao lado dos botões de gostei e não gostei."
  v0_2_0:
    new_1: "Adicionado o botão aos vídeos sugeridos na tela final clássica."
