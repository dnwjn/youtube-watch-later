changelog:
  v0_6_3:
    fixed_1: "Уменьшено число лишних перерисовок кнопки: обновления состояния больше не выполняются синхронно во время отрисовки."
  v0_6_2:
    fixed_1: "Исправлена проблема, из-за которой расширение могло замедлять страницу при долгом просмотре: убран лишний цикл обновления кнопки."
  v0_6_1:
    new_1: "Добавлена настройка «Открывать „Что нового“ после обновления», чтобы вы могли решать, открывать ли эту вкладку автоматически после обновления."
  v0_6_0:
    new_1: "Добавлены новые варианты положения кнопки, включая нижний левый и нижний правый углы."
    new_2: "Добавлена ссылка на эту вкладку «Что нового» в подвале всплывающего окна, теперь последние изменения всегда под рукой, а не только один раз после обновления."
    improved_1: "Кнопка теперь появляется только после загрузки настроек, поэтому не мелькает в неправильном месте."
    improved_2: "Настройки положения перенесены на отдельную страницу и применяются сразу, без перезагрузки страницы."
    improved_3: "Уменьшены размеры шрифтов и ограничена высота всплывающего окна для более компактного вида."
    fixed_1: "Исправлена проблема, из-за которой кнопка могла перестать работать при отсутствии основного файла cookie: теперь используются его варианты first-party и third-party."
    fixed_2: "Исправлено исчезновение и мерцание кнопки при наведении на превью миниатюр."
  v0_5_3:
    fixed_1: "Исправлена проблема, из-за которой кнопка не появлялась в рекомендованных видео справа от видеоплеера."
  v0_5_2:
    fixed_1: "Исправлена проблема в Firefox: кнопка не работала вместе с расширением Multi-Account Containers."
  v0_5_1:
    new_1: "Добавлена эта вкладка «Что нового» (привет!), чтобы вы были в курсе важных последних изменений."
  v0_5_0:
    new_1: "Кнопка добавлена в рекомендованные видео на странице плеера: рядом с плеером (компьютер) и под ним (мобильные устройства)."
    improved_1: "Кнопка стала круглой, чтобы лучше соответствовать дизайну YouTube."
  v0_4_2:
    fixed_1: "Исправлена проблема, из-за которой кнопка не всегда была видна."
    fixed_2: "Исправлена проблема, из-за которой цвета не соответствовали пользовательским темам."
  v0_4_0:
    new_1: "Кнопка добавлена в рекомендованные видео в современной конечной заставке."
    new_2: "Кнопка добавлена в Shorts."
  v0_3_0:
    new_1: "Кнопка добавлена в элементы управления видеоплеера, рядом с кнопками «нравится» и «не нравится»."
  v0_2_0:
    new_1: "Кнопка добавлена в рекомендованные видео в классической конечной заставке."
