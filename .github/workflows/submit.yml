name: Submit to stores

on:
  workflow_dispatch:
  release:
    types: [released]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and zip extension
        run: pnpm run build

      - name: Build and zip source
        run: pnpm run build:source

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v7
        with:
          name: chrome-mv3-prod
          path: build/chrome-mv3-prod.zip

      - name: Upload Edge artifact
        uses: actions/upload-artifact@v7
        with:
          name: edge-mv3-prod
          path: build/edge-mv3-prod.zip

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v7
        with:
          name: firefox-mv2-prod
          path: build/firefox-mv2-prod.zip

      - name: Upload source artifact
        uses: actions/upload-artifact@v7
        with:
          name: source
          path: build/source.zip

  submit-chrome:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Chrome artifact
        uses: actions/download-artifact@v8
        with:
          name: chrome-mv3-prod
          path: build

      - name: Publish to Chrome Web Store
        uses: wdzeng/chrome-extension@37f4f9cdc664959bafef36b1f4da03dec5141620 # v2.0.0
        with:
          extension-id: nmpfhocciajonacicdelpbhipglapgaa
          zip-path: build/chrome-mv3-prod.zip
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}

  submit-edge:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Download Edge artifact
        uses: actions/download-artifact@v8
        with:
          name: edge-mv3-prod
          path: build

      - name: Read Edge certification notes
        id: edge-notes
        run: |
          echo "notes<<EDGE_NOTES_EOF" >> $GITHUB_OUTPUT
          cat docs/edge-notes.md >> $GITHUB_OUTPUT
          echo >> $GITHUB_OUTPUT
          echo "EDGE_NOTES_EOF" >> $GITHUB_OUTPUT

      - name: Publish to Edge Add-ons
        uses: wdzeng/edge-addon@9881f57720358040d079eaa06a4596dc9c273eb6 # v2.1.1
        with:
          product-id: 174f024a-d422-46bd-a9e5-8f62bb76ae21
          zip-path: build/edge-mv3-prod.zip
          client-id: ${{ secrets.EDGE_CLIENT_ID }}
          api-key: ${{ secrets.EDGE_API_KEY }}
          notes-for-certification: ${{ steps.edge-notes.outputs.notes }}

  submit-firefox:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Download Firefox artifact
        uses: actions/download-artifact@v8
        with:
          name: firefox-mv2-prod
          path: build

      - name: Download source artifact
        uses: actions/download-artifact@v8
        with:
          name: source
          path: build

      - name: Read Firefox approval notes
        id: firefox-notes
        run: |
          echo "notes<<FIREFOX_NOTES_EOF" >> $GITHUB_OUTPUT
          cat docs/firefox-notes.md >> $GITHUB_OUTPUT
          echo >> $GITHUB_OUTPUT
          echo "FIREFOX_NOTES_EOF" >> $GITHUB_OUTPUT

      - name: Publish to Firefox Add-ons
        uses: wdzeng/firefox-addon@3184ee491b500e080885e046051366a4228c6e5d # v1.2.1
        with:
          addon-guid: youtube-watch-later
          xpi-path: build/firefox-mv2-prod.zip
          source-file-path: build/source.zip
          jwt-issuer: ${{ secrets.FIREFOX_API_KEY }}
          jwt-secret: ${{ secrets.FIREFOX_API_SECRET }}
          approval-notes: ${{ steps.firefox-notes.outputs.notes }}
